<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email Automation Live Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css?v=react-components-20260702" />
    <link rel="stylesheet" href="/static/build/dashboard.css?v=react-components-20260702" />
    <style>
      .app-shell {
        grid-template-columns: 1fr;
        gap: 6px;
        max-width: 1460px;
        margin: 0 auto;
      }

      .app-rail {
        position: static;
        min-height: 0;
        padding: 6px 8px;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto minmax(360px, auto);
        grid-template-areas:
          "brand tabs status";
        gap: 6px 10px;
        align-items: center;
        overflow: visible;
      }

      .app-rail-top {
        grid-area: brand;
        display: flex;
        align-items: baseline;
        gap: 7px;
      }

      .app-rail-top .eyebrow {
        margin: 0;
      }

      .app-rail-title {
        font-size: clamp(1.1rem, 1.45vw, 1.35rem);
        line-height: 1;
      }

      .app-rail-tabs {
        grid-area: tabs;
        display: inline-flex;
        justify-content: flex-end;
        gap: 6px;
        flex-wrap: wrap;
      }

      .app-rail-tabs .tab-btn {
        min-width: 100px;
        flex: 0 0 auto;
      }

      .app-rail-status {
        grid-area: status;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        padding: 5px 7px;
      }

      .toolbar-status {
        margin-left: auto;
        text-align: right;
        font-size: 10px;
      }

      .workspace-header {
        padding: 0;
        background: transparent;
        border: 0;
        box-shadow: none;
        backdrop-filter: none;
      }

      .workspace-controls {
        display: grid;
        grid-template-columns: 108px 132px minmax(170px, 1fr) auto;
        grid-template-areas: "window cap note actions";
        gap: 7px;
        align-items: end;
        padding: 6px 8px;
      }

      .workspace-controls label {
        gap: 3px;
        font-size: 10px;
        font-weight: 700;
      }

      .workspace-controls .toolbar-field {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .workspace-controls .toolbar-field-window {
        grid-area: window;
      }

      .workspace-controls .toolbar-field-cap {
        grid-area: cap;
      }

      .workspace-controls .toolbar-field select,
      .workspace-controls .toolbar-field input {
        width: 100%;
      }

      .workspace-controls .toolbar-field-note {
        font-size: 10px;
        line-height: 1.25;
        max-width: none;
        grid-area: note;
        margin: 0;
      }

      .workspace-controls .toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
        align-items: center;
        grid-area: actions;
      }

      .workspace-controls .btn,
      .workspace-controls select,
      .workspace-controls input,
      .detail-switcher .btn,
      .detail-switcher select {
        height: 30px;
      }

      .workspace-controls-card {
        display: grid;
        gap: 5px;
        border-radius: 10px;
      }

      .workspace-controls-card .workspace-controls {
        align-self: start;
      }

      .workspace-view {
        gap: 6px;
      }

      .workspace-status-row {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-areas: "controls";
        gap: 6px;
        align-items: start;
      }

      .workspace-controls-card {
        grid-area: controls;
      }

      .workspace-metrics-row {
        display: grid;
        grid-template-columns: minmax(360px, 0.9fr) minmax(300px, 0.65fr);
        gap: 7px;
        align-items: start;
      }

      .workspace-primary {
        grid-template-columns: 1fr;
      }

      .workspace-summary-strip {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 7px;
        align-items: stretch;
      }

      .alerts-grid-compact {
        display: grid;
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .alerts-grid-compact .alert-card,
      .alerts-grid-compact .alert-row {
        grid-template-columns: 88px minmax(0, 1fr);
        align-items: start;
      }

      .alerts-grid-compact .alert-head {
        display: contents;
      }

      .alerts-grid-compact .alert-pill,
      .alerts-grid-compact .alert-row > :first-child {
        align-self: start;
      }

      .alerts-grid-compact h3 {
        margin: 0 0 2px;
        font-size: 13px;
      }

      .alerts-grid-compact .alert-message {
        max-width: none;
        margin: 0;
        font-size: 11px;
        line-height: 1.3;
      }

      .alerts-grid-compact .alert-row:last-child {
        opacity: 0.9;
        border-style: dashed;
        grid-template-columns: 1fr;
      }

      .alerts-grid-compact .alert-row:last-child .alert-pill {
        display: none;
      }

      .alerts-grid-compact .alert-row:last-child .alert-row-body {
        padding-left: 0;
      }

      .alerts-grid-compact .alert-row:last-child h3 {
        color: #dfe8f6;
      }

      .summary-card {
        min-height: 0;
        overflow: visible;
      }

      .summary-head {
        margin-bottom: 2px;
      }

      .summary-card > :nth-child(n+6),
      .summary-card ul,
      .summary-card ol,
      .summary-card .pill-row,
      .summary-card .mini-pill,
      .summary-card .funnel-meta,
      .summary-card .event-chip-row,
      .summary-card .funnel-grid,
      .summary-card .live-metrics-grid,
      .summary-card .webhook-health-grid,
      .summary-card .awaiting-cluster-grid,
      .summary-card .table-shell,
      .summary-card table,
      .summary-card .meta-box,
      .summary-card .metric,
      .summary-card .last-line {
        display: none !important;
      }

      .workspace-card-detail-main {
        padding: 8px 10px;
      }

      .detail-stage {
        min-height: 0;
      }

      .panel-header-compact {
        margin-bottom: 6px;
      }

      .detail-switcher {
        gap: 8px;
      }

      .detail-switcher-label {
        min-width: 240px;
      }

      /* Profile Detail cleanup */
      #detail-panel .eyebrow,
      #detail-panel .detail-kicker,
      #detail-panel .detail-meta,
      #detail-panel .detail-guard-panel,
      #detail-panel .detail-side,
      #detail-panel .detail-pane summary + *,
      #detail-panel .detail-meta-row:nth-child(n+6),
      #detail-panel .detail-activity-row:nth-child(n+5),
      #detail-panel .detail-status-copy .muted {
        display: none;
      }

      #detail-panel .detail-head {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      #detail-panel .detail-layout {
        grid-template-columns: 1fr;
      }

      #detail-panel .detail-main {
        gap: 10px;
      }

      #detail-panel .detail-side {
        display: none;
      }

      @media (max-width: 1280px) {
        .app-rail {
          grid-template-columns: 1fr;
          grid-template-areas:
            "brand"
            "tabs"
            "status";
        }

        .app-rail-tabs {
          justify-content: flex-start;
        }

        .toolbar-status {
          margin-left: 0;
          text-align: left;
        }

        .workspace-status-row {
          grid-template-columns: 1fr;
          grid-template-areas:
            "controls";
        }

        .workspace-metrics-row {
          grid-template-columns: 1fr;
        }

        .workspace-controls {
          grid-template-columns: 1fr;
          grid-template-areas:
            "window"
            "cap"
            "note"
            "actions";
        }

        .workspace-controls .toolbar-actions {
          justify-content: flex-start;
        }

        .workspace-summary-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .alerts-grid-compact .alert-card,
        .alerts-grid-compact .alert-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <template id="dashboard-template">
    <div class="page booting">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <div class="app-shell">
        <aside class="app-rail panel-shell" aria-label="Primary navigation">
          <div class="app-rail-top">
            <p class="eyebrow">Operations Console</p>
            <h1 class="app-rail-title">Email Automation</h1>
          </div>

          <div class="app-rail-tabs topbar-tabs" role="tablist" aria-label="Dashboard sections" aria-orientation="horizontal">
            <button
              id="ops-tab-btn"
              class="tab-btn is-active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="ops-view"
              tabindex="0"
            >
              Dashboard
            </button>
            <button
              id="leads-tab-btn"
              class="tab-btn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="leads-view"
              tabindex="-1"
            >
              Leads
            </button>
          </div>

          <div class="app-rail-status panel-shell">
            <div class="connection">
              <span id="ws-indicator" class="dot dot-off"></span>
              <span id="ws-label">Disconnected</span>
            </div>
            <div class="auth-chip app-rail-auth">
              <span id="auth-status-label" class="auth-status-label">Signed out</span>
              <button id="logout-btn" class="btn btn-secondary btn-sm" type="button">Log out</button>
            </div>
            <p id="toolbar-generated-at" class="toolbar-status muted">Awaiting snapshot</p>
          </div>
        </aside>

        <main class="app-main">
          

          <section id="ops-view" class="dashboard-view workspace-view" role="tabpanel" aria-labelledby="ops-tab-btn">
            <section class="workspace-status-row">
              <header class="workspace-header workspace-controls-card panel-shell">
                <section class="workspace-controls toolbar" aria-label="Dashboard controls">
                  <label class="toolbar-field toolbar-field-window">
                    Window
                    <select id="hours-select">
                      <option value="6">6h</option>
                      <option value="12">12h</option>
                      <option value="24" selected>24h</option>
                      <option value="72">72h</option>
                      <option value="168">168h</option>
                    </select>
                  </label>
                  <label class="toolbar-field toolbar-field-cap">
                    Send target
                    <select id="send-cap-input">
                      <option value="5000">5,000</option>
                      <option value="10000">10,000</option>
                    </select>
                  </label>
                  <div id="send-cap-note" class="toolbar-field-note muted">6 PM-12 PM window</div>
                  <div class="toolbar-actions">
                    <button id="start-btn" class="btn btn-primary" type="button" title="Starts or resumes real sender workers on the live Windows/WSL machine.">Start All</button>
                    <button id="stop-btn" class="btn btn-danger" type="button">Stop All</button>
                    <button id="refresh-btn" class="btn btn-secondary" type="button">Refresh</button>
                    <button id="send-cap-save-btn" class="btn btn-secondary btn-quiet" type="button">Save</button>
                  </div>
                </section>
                <p class="manual-start-warning">
                  <strong>Live sender action:</strong> Manual Start/Resume launches real workers and can consume pending queue rows. Use only on the live Windows/WSL machine. Disabling dashboard auto-start does not disable these manual controls.
                </p>
                <section id="message-bar" class="message-bar hidden"></section>
              </header>
            </section>

          <section class="queue-health-section">
            <div class="ops-strip-head queue-health-head">
              <div>
                <p class="eyebrow">Queue Health</p>
                <p class="muted">Pending work, active senders, outcomes, and alert state</p>
              </div>
            </div>
            <section id="summary-grid" class="summary-grid summary-strip workspace-summary-strip"></section>
          </section>

          <section class="panel panel-shell ops-progress-strip" aria-label="Run Progress and Alerts summary">
            <div class="ops-progress-summary-head">
              <span class="ops-progress-summary-title">Run Progress / Alerts</span>
              <span id="ops-progress-summary" class="ops-progress-summary" aria-live="polite"></span>
              <button
                id="ops-progress-details-toggle"
                class="ops-progress-summary-action"
                type="button"
                aria-controls="ops-progress-details"
                aria-expanded="false"
              >View details</button>
            </div>
          </section>

          <details id="ops-progress-details" class="panel panel-shell workspace-metric-details advanced-details">
            <summary class="panel-summary">
              <span>Run Progress / Alerts details</span>
              <span class="muted">Expanded sender totals and alert details</span>
            </summary>
            <section class="workspace-metrics-row workspace-metric-drawer">
              <section class="panel-shell ops-progress-shell workspace-metric-block">
                <div class="ops-strip-head">
                  <div>
                    <p class="eyebrow">Run Progress</p>
                    <p class="muted">Live send totals by channel</p>
                  </div>
                </div>
                <div id="alerts-progress" class="alerts-progress"></div>
              </section>

              <section class="ops-alerts-strip panel-shell workspace-metric-block">
                <div class="ops-strip-head ops-strip-head-inline">
                  <div>
                    <p class="eyebrow">Active Alerts</p>
                    <p id="alerts-caption" class="muted">No active threshold alerts right now.</p>
                  </div>
                </div>
                <div id="alerts-grid" class="alerts-grid alerts-grid-compact"></div>
              </section>
            </section>
          </details>

            <section class="workspace-primary">
              <details id="detail-panel" class="panel panel-shell workspace-card workspace-card-detail workspace-card-detail-main advanced-details">
                <summary class="panel-summary">
                  <span>Profile Detail</span>
                  <span class="muted">Diagnostics and focused sender controls</span>
                </summary>
                <div class="panel-header panel-header-compact">
                  <div>
                    <h2>Profile Detail</h2>
                    <span id="detail-caption" class="muted">Focused controls, delivery flow, and live diagnostics for one sender.</span>
                  </div>
                  <div class="detail-switcher">
                    <button id="detail-prev-btn" class="btn btn-secondary" type="button" aria-label="Previous profile">Prev</button>
                    <label class="detail-switcher-label">
                      <span class="sr-only">Selected profile</span>
                      <select id="detail-profile-select" aria-label="Selected profile"></select>
                    </label>
                    <button id="detail-next-btn" class="btn btn-secondary" type="button" aria-label="Next profile">Next</button>
                  </div>
                </div>
                <div id="profile-detail" class="detail-stage"></div>
              </details>
            </section>
            <details class="panel panel-shell workspace-card campaign-history-panel advanced-details">
              <summary class="panel-summary">
                <span>Campaign Run History</span>
                <span class="muted">Recent preview, validation, and start activity</span>
              </summary>
              <div class="panel-header panel-header-compact">
                <div>
                  <h2>Campaign Run History</h2>
                  <span class="muted">Recent preview, validation, and start activity.</span>
                </div>
              </div>
              <div id="campaign-run-history" class="campaign-run-history"></div>
            </details>
          </section>

          <section id="leads-view" class="dashboard-view workspace-view leads-workspace hidden" role="tabpanel" aria-labelledby="leads-tab-btn" hidden>
            <section class="leads-page-title" aria-labelledby="leads-page-title-heading">
              <p class="eyebrow">Leads</p>
              <h2 id="leads-page-title-heading">Leads Operations</h2>
              <p class="muted">Clean, triage, and prepare lead sources.</p>
              <p id="leads-current-queue-note" class="leads-current-queue-note muted" hidden></p>
            </section>

            <section class="panel panel-shell leads-panel leads-command-center operator-workflow-section">
              <div class="panel-header panel-header-compact">
                <div>
                  <p class="eyebrow">Command Center</p>
                  <h2 id="leads-command-heading">Prepare Dispatch</h2>
                  <span id="leads-pipeline-meta" class="muted">Current source, preview, and queue confirmation in one place.</span>
                </div>
              </div>
              <section class="leads-control-bar leads-ops-bar" aria-label="Lead source and check controls">
                <div class="leads-control-source">
                  <p class="eyebrow">Upload / Source / Check</p>
                  <strong>Lead source</strong>
                  <span id="leads-important-check-meta" class="muted">Choose a CSV/XLSX file or check the stored intake source.</span>
                  <label class="leads-upload-type-field">
                    <span>Upload type</span>
                    <select id="leads-important-upload-type" aria-label="Lead upload type">
                      <option value="cold">Cold Leads</option>
                      <option value="warm_research">Warm Research</option>
                    </select>
                  </label>
                  <input id="leads-important-input-path" type="hidden" value="_important/leadschecker.csv" />
                  <input id="leads-important-output-path" type="hidden" value="_important/leads.csv" />
                  <input id="leads-important-rejected-path" type="hidden" value="_important/leads_rejected.csv" />
                  <div class="leads-control-file-row">
                    <input id="leads-important-upload-file" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                  </div>
                  <span id="leads-important-upload-note" class="toolbar-field-note muted">Upload is file-only. Preview and confirm remain separate.</span>
                </div>
                <div class="leads-control-results">
                  <span>Last check result</span>
                  <div id="leads-control-check-result" class="leads-control-check-chips">Waiting for source status</div>
                </div>
                <div class="leads-control-actions">
                  <span class="leads-source-actions-label">Source actions</span>
                  <button id="leads-important-check-btn" class="btn btn-secondary" type="button">Check Leads</button>
                  <button id="leads-important-upload-check-btn" class="btn btn-secondary" type="button">Upload &amp; Check</button>
                  <button id="leads-important-dispatch-preview-top-btn" class="btn btn-secondary leads-preview-duplicate" type="button">Preview Dispatch</button>
                </div>
              </section>
              <div id="leads-workflow-status-banner" class="leads-workflow-status-banner" aria-live="polite"></div>
              <div id="leads-workflow-task-list" class="leads-workflow-task-list leads-workflow-tracker" aria-live="polite"></div>

              <div class="leads-command-main">
                <div class="leads-command-column leads-command-column-left">
                  <div id="leads-current-run-panel" class="leads-current-run-panel leads-source-summary-row" aria-live="polite"></div>

                  <div class="leads-command-section leads-campaign-command">
                    <div class="command-section-head">
                      <div>
                        <p class="eyebrow">Campaign</p>
                        <h3>Select source and mode</h3>
                        <span class="muted">Changing source changes the eligible count.</span>
                      </div>
                    </div>
                    <div id="leads-dispatch-current-queue-note" class="leads-dispatch-current-queue-note" hidden>Finish current JC queue before preparing the next dispatch.</div>
                    <div id="leads-dispatch-mode-cards" class="dispatch-mode-cards" role="group" aria-label="Dispatch mode"></div>
                    <div class="leads-dispatch-grid leads-command-controls">
                      <div class="leads-quick-file dispatch-technical-select">
                        <span class="label">Dispatch Source</span>
                        <select id="leads-dispatch-source-mode">
                          <option value="triaged_keep">Fresh Cold Keep</option>
                          <option value="strict_verified">Strict Public Proof</option>
                          <option value="cleaned">Recontact Pool / Checked Output</option>
                        </select>
                        <span id="leads-dispatch-source-note" class="toolbar-field-note muted">Changing source changes the eligible count. Fresh Cold Keep reads <strong>_important/leads_triaged_keep.csv</strong>. Strict reads <strong>_important/leads_verified.csv</strong>. Recontact uses checked output.</span>
                      </div>
                      <div class="leads-quick-file">
                        <span class="label">Cap</span>
                        <input id="leads-dispatch-cap" type="text" value="all" spellcheck="false" />
                        <span class="toolbar-field-note muted">Use <strong>all</strong> or a number for this dispatch preview.</span>
                      </div>
                      <div class="leads-quick-file dispatch-technical-select">
                        <span class="label">Campaign Type</span>
                        <select id="leads-dispatch-campaign-type">
                          <option value="cold">Fresh Cold — excludes prior contacts</option>
                          <option value="recontact_cold">Recontact — allows prior contacts</option>
                        </select>
                        <span class="toolbar-field-note muted">Recontact allows prior sends/contact while keeping suppressions and bad outcomes blocked.</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div id="leads-dispatch-command-column" class="leads-command-column leads-command-column-right">
                  <div class="leads-command-section leads-preview-command">
                    <div class="command-section-head">
                      <div>
                        <p class="eyebrow">Preview</p>
                        <h3>Dispatch Preview</h3>
                        <span class="muted">Read-only. Calculates planned queues and safety counts without writing recipient queues.</span>
                      </div>
                      <button id="leads-important-dispatch-preview-btn" class="btn btn-secondary" type="button">Preview Dispatch</button>
                    </div>
                    <div id="leads-important-dispatch-meta" class="leads-meta muted">Dispatch is idle. Stop all senders, preview the exact write set, then confirm.</div>
                    <div id="leads-important-dispatch-results" class="leads-results"></div>
                  </div>

                  <div class="leads-command-section leads-confirm-command">
                    <div class="command-section-head">
                      <div>
                        <p class="eyebrow">Confirm</p>
                        <h3>Confirm queue</h3>
                        <span class="muted">Confirm writes queues only after the selected preview is current and safety checks pass.</span>
                      </div>
                      <div class="leads-action-slot leads-confirm-action-slot">
                        <label id="leads-recontact-override-wrap" class="recontact-override" hidden>
                          <input id="leads-recontact-recency-override" type="checkbox" />
                          I understand this full recontact campaign includes recently contacted leads.
                        </label>
                        <button id="leads-important-dispatch-confirm-btn" class="btn btn-primary" type="button" disabled>Confirm Dispatch</button>
                      </div>
                    </div>
                  </div>

                  <div class="leads-command-section leads-start-command">
                    <div class="command-section-head">
                      <div>
                        <p class="eyebrow">Start Senders</p>
                        <h3>Locked until queues exist</h3>
                        <span class="muted">Start controls stay on the Dashboard after Confirm writes live queues.</span>
                      </div>
                      <span class="mini-pill">No queue</span>
                    </div>
                  </div>
                </div>
              </div>

              <details class="leads-collapsible advanced-details leads-advanced-diagnostics">
                <summary>Advanced diagnostics</summary>
                <div id="leads-operator-status-strip" class="operator-status-strip" aria-label="Leads status summary"></div>
                <div id="lead-funnel-summary" class="lead-funnel-summary"></div>
                <div class="leads-run-safety-grid">
                  <div id="leads-run-safety-card" class="leads-run-safety-card leads-run-safety-card-wait">
                    <div class="leads-run-safety-head">
                      <div>
                        <p class="eyebrow">Current Run Safety</p>
                        <strong>WAIT</strong>
                      </div>
                      <span class="mini-pill">Refreshing</span>
                    </div>
                    <p class="muted">Waiting for the latest dashboard status.</p>
                  </div>
                  <div id="next-batch-prep-card" class="leads-run-safety-card leads-run-safety-card-wait">
                    <div class="leads-run-safety-head">
                      <div>
                        <p class="eyebrow">Next Batch Prep Status</p>
                        <strong>WAIT</strong>
                      </div>
